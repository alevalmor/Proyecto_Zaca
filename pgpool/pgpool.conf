# Pgpool-II de una sede. No se copia a mano: pgpool/instalar.sh llena los @...@ y lo deja en /etc/pgpool2/.
# Modo raw: las dos sedes son master, Pgpool no balancea ni replica (eso lo hace la replicación lógica
# de moscamed.sql). Manda todo al nodo 0, el PostgreSQL de su sede, y si se cae, al nodo 1, el de la otra
# sede, que tiene los mismos datos. Rutas de log, socket y pid: las del paquete pgpool2 de Debian/Ubuntu.
backend_clustering_mode = 'raw'

backend_hostname0 = '@NODO0@'
backend_port0 = @PUERTO@
backend_flag0 = 'ALLOW_TO_FAILOVER'
backend_hostname1 = '@NODO1@'
backend_port1 = @PUERTO@
backend_flag1 = 'ALLOW_TO_FAILOVER'

listen_addresses = '*'
port = 9999

# Cada persona entra con su propio usuario de PostgreSQL y el administrador los crea desde el Programa 2,
# así que no hay pool_passwd: Pgpool pide la contraseña al programa y con ella entra al nodo (SCRAM).
# shortcut: la contraseña viaja en claro del programa a Pgpool; en producción activa ssl = on con certificado.
enable_pool_hba = off
pool_passwd = ''
allow_clear_text_frontend_auth = on

num_init_children = 32
max_pool = 4
connection_cache = on
load_balance_mode = off

# Revisa cada 5 s que los nodos respondan con el usuario pgpool que crea moscamed.sql.
health_check_period = 5
health_check_timeout = 5
health_check_max_retries = 2
health_check_retry_delay = 2
health_check_user = 'pgpool'
health_check_password = '@CLAVE@'
health_check_database = 'postgres'
failover_on_backend_error = on
