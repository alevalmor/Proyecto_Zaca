# Pgpool-II del centro de empaque (en producción 192.168.20.10:9999). Igual que planta.conf con los nodos al revés.
# Modo raw: las dos sedes son master, Pgpool no balancea ni replica; manda todo al nodo 0
# y, si se cae, al nodo 1 (el servidor de la otra sede), que tiene los mismos datos por la replicación.
backend_clustering_mode = 'raw'

backend_hostname0 = 'empaque'
backend_port0 = 5432
backend_flag0 = 'ALLOW_TO_FAILOVER'
backend_hostname1 = 'planta'
backend_port1 = 5432
backend_flag1 = 'ALLOW_TO_FAILOVER'

listen_addresses = '*'
port = 9999
socket_dir = '/tmp'
pcp_listen_addresses = ''
pcp_socket_dir = '/tmp'
pid_file_name = '/tmp/pgpool.pid'
logdir = '/tmp'
log_destination = 'stderr'

# Cada persona entra con su propio usuario de PostgreSQL y el administrador los crea desde el Programa 2,
# así que no hay pool_passwd: Pgpool pide la contraseña al programa y con ella entra al nodo (SCRAM).
# shortcut: la contraseña viaja en claro del programa a Pgpool; en producción activa ssl = on con certificado.
enable_pool_hba = off
pool_passwd = ''
allow_clear_text_frontend_auth = on

num_init_children = 32
max_pool = 4
connection_cache = on
load_balance_mode = off

health_check_period = 5
health_check_timeout = 5
health_check_max_retries = 2
health_check_retry_delay = 2
health_check_user = 'pgpool'
health_check_password = 'pgpool'
health_check_database = 'postgres'
failover_on_backend_error = on
