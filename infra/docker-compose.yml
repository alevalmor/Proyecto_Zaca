# Infraestructura Moscamed para desarrollo y pruebas en una sola máquina:
#   planta / empaque  PostgreSQL 18 master-master (replicación lógica en los dos sentidos)
#   pgpool-planta / pgpool-empaque  Pgpool-II de cada sede; si cae su nodo, pasa al de la otra sede
#   trampeo  base de trampeo que las sedes leen con postgres_fdw
# Arranque: docker compose up -d --build   (desde esta carpeta)
name: moscamed

x-nodo: &nodo
  image: postgres:18
  command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=10", "-c", "max_wal_senders=10"]
  healthcheck:
    test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres"]
    interval: 2s
    timeout: 3s
    retries: 60
  restart: unless-stopped

services:
  planta:
    <<: *nodo
    environment: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: moscamed, SEDE: planta, INICIO: "1" }
    volumes: ["../sql:/sql:ro", "./init-nodo.sh:/docker-entrypoint-initdb.d/init-nodo.sh:ro", "datos-planta:/var/lib/postgresql"]
    ports: ["5433:5432"]

  empaque:
    <<: *nodo
    environment: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: moscamed, SEDE: empaque, INICIO: "2" }
    volumes: ["../sql:/sql:ro", "./init-nodo.sh:/docker-entrypoint-initdb.d/init-nodo.sh:ro", "datos-empaque:/var/lib/postgresql"]
    ports: ["5434:5432"]

  trampeo:
    <<: *nodo
    command: ["postgres"]
    environment: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: trampeo }
    volumes: ["../sql/trampeo.sql:/docker-entrypoint-initdb.d/trampeo.sql:ro", "datos-trampeo:/var/lib/postgresql"]
    ports: ["5435:5432"]

  # Una sola vez: FDW y suscripciones cruzadas (necesita las tres bases arriba).
  configurar:
    image: postgres:18
    entrypoint: ["bash", "/infra/configurar.sh"]
    volumes: ["../sql:/sql:ro", "./configurar.sh:/infra/configurar.sh:ro"]
    depends_on:
      planta: { condition: service_healthy }
      empaque: { condition: service_healthy }
      trampeo: { condition: service_healthy }
    restart: "no"

  pgpool-planta:
    build: ./pgpool
    volumes: ["./pgpool/planta.conf:/etc/pgpool2/pgpool.conf:ro"]
    ports: ["9991:9999"]
    depends_on:
      configurar: { condition: service_completed_successfully }
    restart: unless-stopped

  pgpool-empaque:
    build: ./pgpool
    volumes: ["./pgpool/empaque.conf:/etc/pgpool2/pgpool.conf:ro"]
    ports: ["9992:9999"]
    depends_on:
      configurar: { condition: service_completed_successfully }
    restart: unless-stopped

volumes:
  datos-planta:
  datos-empaque:
  datos-trampeo:
